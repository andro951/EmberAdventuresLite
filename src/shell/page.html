

<div id="mainMenu" class="main-menu main-menu-art"></div>
<button id="adminInboxBtn" class="admin-inbox-button hidden" type="button" onclick="EmberAdventures.openAdminInboxNotice()" title="Open administrator inbox summary">
    <span aria-hidden="true">&#9993;</span>
    <span>Admin Inbox</span>
    <strong id="adminInboxBadge">0</strong>
</button>
<div id="app" class="main-menu-hidden">
    <header class="topbar">
        <div class="brand">
            <strong>Ember Adventures Lite</strong>
            <span>AI RPG Stories</span>
        </div>
        <div class="top-actions">
            <button id="mainMenuBtn" class="tool-button primary" data-top-priority="1" title="Return to main menu"><span class="tool-icon">&#8962;</span><span class="tool-label">Main Menu</span></button>
            <button id="charactersBtn" class="tool-button" data-top-priority="4" title="Characters"><span class="tool-icon">&#128101;</span><span class="tool-label">Characters</span></button>
            <button id="guideBtn" class="tool-button subtle" data-top-priority="5" title="Guidance"><span class="tool-icon">&#127919;</span><span class="tool-label">Guidance</span></button>
            <button id="shopsBtn" class="tool-button" data-top-priority="3" title="Shops and job boards"><span class="tool-icon">&#127978;</span><span class="tool-label">Shops</span></button>
            <button id="mapBtn" class="tool-button" data-top-priority="7" title="Locations map"><span class="tool-icon">&#128506;</span><span class="tool-label">Map</span></button>
            <button id="stateBtn" class="tool-button dev-only-tool" data-top-priority="9" title="Edit raw game state"><span class="tool-icon">&#128295;</span><span class="tool-label">State</span></button>
            <button id="settingsBtn" class="tool-button" title="Settings" onclick="EmberAdventures.openSettingsModal()"><span class="tool-icon">&#9881;</span><span class="tool-label">Settings</span></button>
            <details class="tool-menu">
                <summary class="tool-button" title="More tools"><span class="tool-icon">&#9776;</span><span class="tool-label">Tools</span></summary>
                <div class="tool-menu-panel">
                    <button class="tool-button primary" onclick="EmberAdventures.openMainMenu()" title="Return to main menu"><span class="tool-icon">&#8962;</span><span class="tool-label">Main Menu</span></button>
                    <button class="tool-button" onclick="EmberAdventures.openCharactersModal()" title="Characters"><span class="tool-icon">&#128101;</span><span class="tool-label">Characters</span></button>
                    <button class="tool-button subtle" onclick="EmberAdventures.openGuideModal()" title="Guidance"><span class="tool-icon">&#127919;</span><span class="tool-label">Guidance</span></button>
                    <button class="tool-button" onclick="EmberAdventures.openStoryShopsModal()" title="Shops and job boards"><span class="tool-icon">&#127978;</span><span class="tool-label">Shops</span></button>
                    <button class="tool-button" onclick="EmberAdventures.openMapModal()" title="Locations map"><span class="tool-icon">&#128506;</span><span class="tool-label">Map</span></button>
                    <button class="tool-button dev-only-tool" onclick="EmberAdventures.openStateModal()" title="Edit raw game state"><span class="tool-icon">&#128295;</span><span class="tool-label">State</span></button>
                    <button class="tool-button" onclick="EmberAdventures.openSettingsModal()" title="Settings"><span class="tool-icon">&#9881;</span><span class="tool-label">Settings</span></button>
                    <button class="tool-button discord" onclick="EmberAdventures.openDiscord()" title="Open the EmberAdventures Discord"><span class="tool-icon">&#128172;</span><span class="tool-label">Discord</span></button>
                </div>
            </details>
        </div>
    </header>
    <section id="topObjectivePanel" class="top-objective-panel hidden"></section>
    <section id="playHud" class="play-hud hidden"></section>
    <aside class="sidebar" id="leftPanel" onscroll="EmberAdventures.saveLeftPanelScroll?.()">
        <div id="leftGroupTabs" class="left-group-tabs"></div>
        <div id="leftGroupBody" class="left-group-body"></div>
    </aside>
    <main class="main">
        <section id="thread" class="thread"></section>
    </main>
    <aside class="rightbar">
        <div class="panel-title">Images</div>
        <div class="image-toolbar">
            <button id="imageLabBtn" class="tool-button info" type="button" title="Open Image Lab"><span class="tool-icon">&#127912;</span><span class="tool-label">Image Lab</span></button>
            <button id="imageViewerBtn" class="tool-button violet" type="button" title="Browse all saved images"><span class="tool-icon">&#128247;&#65039;</span><span class="tool-label">All Images</span></button>
            <span id="imageToolbarMode" class="image-mode-row"></span>
            <label>
                Art style
                <select id="imageModelSelect"></select>
            </label>
        </div>
        <div id="imagePanel" class="stack"></div>
    </aside>
    <button id="mobileLeftDrawerBtn" class="tool-button mobile-drawer-button drawer-edge-tab left" type="button" title="Show or hide party, NPC, and scene info"><span class="tool-label drawer-tab-text">&#9776; Info</span></button>
    <button id="mobileRightDrawerBtn" class="tool-button mobile-drawer-button drawer-edge-tab right info" type="button" title="Show or hide image drawer"><span class="tool-label drawer-tab-text">&#128247; Images</span></button>
    <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" onclick="EmberAdventures.closeMobileDrawer()"></div>
    <section class="composer">
        <div id="composerGuidance" class="composer-guidance"></div>
        <div
            id="quickActions"
            class="quick-action-controls"
        ></div>
        <div class="composer-input-row">
            <textarea id="input" placeholder="Describe what you do or say..."></textarea>
            <div class="composer-actions">
                <button id="sendBtn" class="tool-button primary" aria-label="Send message" data-help="Send your message to the scene."><span class="tool-icon">&#10148;</span><span class="tool-label">Send</span></button>
                <button id="imageBtn" class="tool-button info" aria-label="Generate scene image" data-help="Generate a normal scene image."><span class="tool-icon">&#128247;</span><span class="tool-label">Image</span></button>
            </div>
        </div>
    </section>
</div>
<div id="modal" class="modal">
    <div id="modalBox" class="modal-box"></div>
</div>
<div id="storyBuilderOverlay" class="story-builder hidden"></div>
